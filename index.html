    const TripHeader = ({ theme, toggleTheme }) => {
      const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });

      useEffect(() => {
        const calculateTime = () => {
          const now = new Date();
          const difference = TRIP_START_DATE.getTime() - now.getTime();
          if (difference > 0) {
            setTimeLeft({
              days: Math.floor(difference / (1000 * 60 * 60 * 24)),
              hours: Math.floor((difference / (1000 * 60 * 60)) % 24),
              minutes: Math.floor((difference / 1000 / 60) % 60),
              seconds: Math.floor((difference / 1000) % 60)
            });
          } else {
            setTimeLeft({ days: 0, hours: 0, minutes: 0, seconds: 0 });
          }
        };
        calculateTime();
        const interval = setInterval(calculateTime, 1000);
        return () => clearInterval(interval);
      }, []);

                </button>
              </div>
            </header>

            <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">
              <TripHeader theme={theme} toggleTheme={toggleTheme} />

              {activeTab === 'dashboard' && (
                <div className="space-y-8">
                  <div className="bg-gradient-to-r from-amber-500 to-[#F97316] p-5 rounded-2xl text-white shadow-lg flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                    <div className="flex items-center gap-4">
                      <div className="p-3 bg-white/20 rounded-2xl backdrop-blur-md">
                        <Icon name="shield-alert" size={28} color="#FFFFFF" />
                      </div>
                      <div>
                        <h3 className="font-bold text-base">{MOCK_MEETING_POINT.title}</h3>
                        <p className="text-xs text-white/90">{MOCK_MEETING_POINT.address} &bull; {MOCK_MEETING_POINT.note}</p>
                      </div>
                    </div>
                    <button
                      onClick={() => openExternalMap(MOCK_MEETING_POINT.lat, MOCK_MEETING_POINT.lng, MOCK_MEETING_POINT.title)}
                      className="w-full md:w-auto px-4 py-2.5 bg-white text-[#F97316] font-bold text-xs rounded-xl shadow-md hover:bg-slate-100 transition-colors flex items-center justify-center gap-1 shrink-0"
                    >
                      <Icon name="navigation" size={14} color="#F97316" /> Rota para o Encontro
                    </button>
                  </div>

                  <div>
                    <h2 className="text-xl font-bold text-slate-800 dark:text-white mb-4 flex items-center gap-2">
                      <Icon name="plane" size={22} color="#0284C7" /> Voos Reservados (Ryanair)
                    </h2>
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                      {MOCK_FLIGHTS.map((flight) => (
                        <FlightCard key={flight.id} flight={flight} />
                      ))}
                    </div>
                  </div>

                  <div>
                    <h2 className="text-xl font-bold text-slate-800 dark:text-white mb-4 flex items-center gap-2">
                      <Icon name="hotel" size={22} color="#E05A47" /> Alojamento Principal
                    </h2>
                    <div className="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-lg border border-slate-100 dark:border-slate-700 flex flex-col lg:flex-row justify-between gap-6">
                      <div className="space-y-3 flex-1">
                        <div className="flex items-center gap-2">
                          <span className="px-3 py-1 bg-rose-100 dark:bg-rose-900/40 text-[#E05A47] text-xs font-extrabold rounded-full">
                            Hotel 4 Estrelas
                          </span>
                          <span className="text-xs font-bold text-amber-500">★ {MOCK_HOTEL.rating} / 5.0</span>
                        </div>
                        <h3 className="text-2xl font-bold text-slate-800 dark:text-white">{MOCK_HOTEL.name}</h3>
                        <p className="text-xs text-slate-500 dark:text-slate-400 flex items-center gap-1">
                          <Icon name="map-pin" size={14} color="#E05A47" /> {MOCK_HOTEL.address}
                        </p>
                        <div className="grid grid-cols-2 gap-4 pt-2">
                          <div className="bg-slate-50 dark:bg-slate-700/50 p-3 rounded-2xl">
                            <span className="text-[10px] text-slate-400 block font-semibold">Check-in</span>
                            <span className="text-xs font-bold text-slate-700 dark:text-slate-200">{MOCK_HOTEL.checkIn}</span>
                          </div>
                          <div className="bg-slate-50 dark:bg-slate-700/50 p-3 rounded-2xl">
                            <span className="text-[10px] text-slate-400 block font-semibold">Check-out</span>
                            <span className="text-xs font-bold text-slate-700 dark:text-slate-200">{MOCK_HOTEL.checkOut}</span>
                          </div>
                        </div>
                        <div className="flex flex-wrap gap-2 pt-2">
                          {MOCK_HOTEL.amenities.map((item, idx) => (
                            <span key={idx} className="bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 text-xs px-2.5 py-1 rounded-lg">
                              {item}
                            </span>
                          ))}
                        </div>
                      </div>
                      <div className="flex flex-col justify-between items-stretch lg:w-72 bg-slate-50 dark:bg-slate-900/50 p-5 rounded-2xl border border-slate-100 dark:border-slate-800">
                        <div>
                          <span className="text-xs text-slate-400 block">Código de Reserva</span>
                          <span className="text-lg font-black text-[#E05A47] block tracking-wide mb-3">{MOCK_HOTEL.confirmationCode}</span>
                          <span className="text-xs text-slate-400 block">Telefone</span>
                          <span className="text-xs font-bold text-slate-700 dark:text-slate-300 block mb-4">{MOCK_HOTEL.phone}</span>
                        </div>
                        <button
                          onClick={() => openExternalMap(MOCK_HOTEL.lat, MOCK_HOTEL.lng, MOCK_HOTEL.name)}
                          className="w-full py-3 bg-[#E05A47] hover:bg-[#c94b3a] text-white font-bold text-xs rounded-xl shadow-md transition-colors flex items-center justify-center gap-2"
                        >
                          <Icon name="navigation" size={14} color="#FFFFFF" /> NAVEGAR PARA O HOTEL
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {activeTab === 'itinerary' && (
                <div className="space-y-6">
                  <div className="flex gap-2 overflow-x-auto pb-2">
                    {[
                      { day: 1, date: '01 Out (Quinta)', label: 'Chegada & Toulouse' },
                      { day: 2, date: '02 Out (Sexta)', label: 'Excursão Carcassonne' },
                      { day: 3, date: '03 Out (Sábado)', label: 'Excursão Albi & Cordes' },
                      { day: 4, date: '04 Out (Domingo)', label: 'Mercado & Regresso' },
                    ].map((d) => (
                      <button
                        key={d.day}
                        onClick={() => setSelectedDay(d.day)}
                        className={`flex-1 min-w-[160px] p-4 rounded-2xl text-left transition-all border ${
                          selectedDay === d.day
                            ? 'bg-[#E05A47] text-white border-[#E05A47] shadow-lg scale-102'
                            : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-700'
                        }`}
                      >
                        <span className="text-xs font-extrabold opacity-80 block uppercase">Dia {d.day}</span>
                        <span className="text-base font-bold block">{d.date}</span>
                        <span className="text-[11px] opacity-90 truncate block mt-1">{d.label}</span>
                      </button>
                    ))}
                  </div>

                  <div className="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-lg border border-slate-100 dark:border-slate-700">
                    <div className="mb-6 pb-4 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center">
                      <div>
                        <h2 className="text-xl font-bold text-slate-800 dark:text-white">
                          Agenda do Dia {selectedDay}
                        </h2>
                        <p className="text-xs text-slate-400">Todos os horários estão sincronizados no fuso horário francês (CEST)</p>
                      </div>
                      <span className="px-3 py-1 bg-rose-50 dark:bg-rose-950/50 text-[#E05A47] text-xs font-bold rounded-full">
                        {filteredItinerary.length} Eventos
                      </span>
                    </div>
                    <div className="pt-2">
                      {filteredItinerary.map((item, idx) => (
                        <TimelineItem
                          key={item.id}
                          item={item}
                          isLast={idx === filteredItinerary.length - 1}
                        />
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {activeTab === 'map' && <MapViewComponent />}
              {activeTab === 'concierge' && <AIConciergeTab />}
              {activeTab === 'guide' && <LocalGuideTab />}
            </main>

            <div className="md:hidden fixed bottom-0 left-0 right-0 z-50 bg-white/90 dark:bg-slate-900/90 backdrop-blur-lg border-t border-slate-200 dark:border-slate-800 px-4 py-2 flex items-center justify-around">
              {[
                { id: 'dashboard', label: 'Inicio', icon: 'calendar' },
                { id: 'itinerary', label: 'Agenda', icon: 'clock' },
                { id: 'map', label: 'Mapa', icon: 'map-pin' },
                { id: 'concierge', label: 'AI Chat', icon: 'sparkles' },
                { id: 'guide', label: 'Guia', icon: 'book-open' },
              ].map((tab) => {
                const isActive = activeTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex flex-col items-center py-1 px-2 rounded-xl transition-all ${
                      isActive ? 'text-[#E05A47] font-bold' : 'text-slate-400 hover:text-slate-600'
                    }`}
                  >
                    <Icon name={tab.icon} size={20} color={isActive ? '#E05A47' : '#94A3B8'} />
                    <span className="text-[10px] mt-1">{tab.label}</span>
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
